<!doctype html>
<html class="no-js" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Daily Score</title>

  <link rel="stylesheet"
    href="https://dhbhdrzi4tiry.cloudfront.net/cdn/sites/foundation.min.css">

<style>
  body {
    background-color: #f5f7fa;
  }

  .top-bar {
    background-color: #1f2937;
  }

  .top-bar .menu {
    background-color: #1f2937;
  }

  .top-bar a,
  .top-bar .menu-text {
    color: white;
  }

  .callout.large {
    background-color: #e8eef7;
    padding: 4rem 1rem;
  }

  .callout h1 {
    font-weight: bold;
    font-size: 3rem;
  }

  .row {
    margin-top: 2rem;
  }

  h3 {
    font-weight: bold;
  }
</style>

</head>


<body>

  <!-- Top navigation bar -->
  <div class="top-bar">
    <div class="top-bar-left">
      <ul class="menu">
        <li class="menu-text">Daily Score</li>
        <li><a href="#">Home</a></li>
        <li><a href="#">My Day</a></li>
      </ul>
    </div>
  </div>

  <!-- Main banner -->
  <div class="callout large">
    <div class="row column text-center">
      <h1>How Was Your Day?</h1>
      <p class="lead">
        Track your health, productivity, growth, and balance.
      </p>
      <a href="#" class="button large">Start My Check-In</a>
    </div>
  </div>

 <!-- Daily check-in categories -->
<div class="row">

  <div class="medium-4 columns">
    <div class="callout">
      <h3>Health & Fitness</h3>

      <label>
        <input type="checkbox"> Lifted / exercised
      </label>

      <label>
        <input type="checkbox"> Did cardio
      </label>

      <label>
        <input type="checkbox"> Hit protein goal
      </label>

      <label>
        <input type="checkbox"> Hit calorie goal
      </label>
    </div>
  </div>

  <div class="medium-4 columns">
    <div class="callout">
      <h3>Productivity</h3>

      <label>
        <input type="checkbox"> Completed schoolwork
      </label>

      <label>
        <input type="checkbox"> Worked on a skill
      </label>

      <label>
        <input type="checkbox"> Handled important responsibilities
      </label>
    </div>
  </div>

  <div class="medium-4 columns">
    <div class="callout">
      <h3>Life & Social</h3>

      <label>
        <input type="checkbox"> Made time for myself
      </label>

      <label>
        <input type="checkbox"> Checked on friends or family
      </label>

      <label>
        <input type="checkbox"> Tried something new
      </label>

      <label>
        <input type="checkbox"> Talked to someone new
      </label>
    </div>
  </div>

</div>

  <hr>

  <div class="row column text-center">
    <h3>Your Daily Score</h3>
    <p>Complete your daily check-in to see how balanced your day was.</p>
  </div>

  <script src="https://code.jquery.com/jquery-2.1.4.min.js"></script>

  <script src="https://dhbhdrzi4tiry.cloudfront.net/cdn/sites/foundation.js">
  </script>

  <script>
    $(document).foundation();
  </script>

</body>
</html>
